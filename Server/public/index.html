<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Descon Online</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}

body {
	color: #ffffff;
	background-color: #030712;
	overflow: hidden;
	touch-action: none;
	font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	left: 0;
	top: 0;
	right: 0;
	bottom: 0;
	background: radial-gradient(circle at center, #0d1b3e 0%, #050c1e 50%, #02050c 100%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	z-index: 100;
}

.logo-wrapper {
	position: relative;
	display: flex;
	justify-content: center;
	align-items: center;
	margin-bottom: 20px;
}

#status-splash {
	width: 220px;
	height: 220px;
	object-fit: contain;
	filter: drop-shadow(0 0 30px rgba(0, 217, 255, 0.45));
	animation: pulseLogo 3s ease-in-out infinite alternate;
}

@keyframes pulseLogo {
	0% {
		transform: scale(0.97);
		filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.35));
	}
	100% {
		transform: scale(1.03);
		filter: drop-shadow(0 0 45px rgba(0, 217, 255, 0.65));
	}
}

.title-container {
	text-align: center;
	margin-bottom: 25px;
}

.title-main {
	font-size: 28px;
	font-weight: 800;
	letter-spacing: 6px;
	color: #ffffff;
	text-transform: uppercase;
	margin: 0;
	text-shadow: 0 0 25px rgba(0, 217, 255, 0.7);
}

.title-sub {
	font-size: 13px;
	letter-spacing: 3px;
	color: #00d9ff;
	margin-top: 6px;
	font-weight: 500;
	opacity: 0.9;
	text-transform: uppercase;
}

.progress-box {
	width: min(480px, 86vw);
	margin: 0 auto;
	text-align: center;
}

.progress-bar-container {
	height: 18px;
	background: rgba(5, 14, 30, 0.92);
	border: 1px solid rgba(0, 217, 255, 0.55);
	border-radius: 10px;
	overflow: hidden;
	padding: 2px;
	box-shadow: 0 0 25px rgba(0, 217, 255, 0.25), inset 0 0 12px rgba(0, 0, 0, 0.85);
}

#status-progress-bar {
	height: 100%;
	width: 0%;
	background: linear-gradient(90deg, #0052d4, #0084ff, #00d9ff, #6efffc);
	background-size: 200% 100%;
	border-radius: 7px;
	box-shadow: 0 0 16px rgba(0, 217, 255, 0.85);
	transition: width 0.15s ease-out;
	animation: shimmer 2s linear infinite;
}

@keyframes shimmer {
	0% { background-position: 100% 0; }
	100% { background-position: -100% 0; }
}

#status-percentage {
	font-family: 'Consolas', 'Courier New', monospace;
	font-size: 13px;
	color: #00d9ff;
	margin-top: 12px;
	font-weight: 600;
	letter-spacing: 1px;
	text-shadow: 0 0 10px rgba(0, 217, 255, 0.6);
}

#status-server-info {
	font-size: 11px;
	color: rgba(255, 255, 255, 0.45);
	margin-top: 6px;
	letter-spacing: 1px;
	text-transform: uppercase;
}

#status-notice {
	display: none;
	background: rgba(45, 10, 20, 0.9);
	border-radius: 0.75rem;
	border: 1px solid #ff4757;
	color: #ffd2d6;
	font-family: 'Segoe UI', sans-serif;
	line-height: 1.4;
	margin-top: 1.5rem;
	padding: 1rem 1.5rem;
	text-align: center;
	box-shadow: 0 0 30px rgba(255, 71, 87, 0.35);
	max-width: 520px;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="Descon.png" />
		<link rel="apple-touch-icon" href="Descon.apple-touch-icon.png"/>
	</head>
	<body>
		<canvas id="canvas">
			Tu navegador no soporta WebGL o Canvas.
		</canvas>

		<noscript>
			Tu navegador debe tener JavaScript habilitado para jugar Descon.
		</noscript>

		<div id="status">
			<div class="logo-wrapper">
				<img id="status-splash" src="Descon.png" alt="Descon">
			</div>
			<div class="title-container">
				<h1 class="title-main">DESCON ONLINE</h1>
				<div class="title-sub">Universo Virtual 2.5D</div>
			</div>
			<div class="progress-box">
				<div class="progress-bar-container">
					<div id="status-progress-bar"></div>
				</div>
				<div id="status-percentage">Iniciando conexión segura...</div>
				<div id="status-server-info">Servidor: Oracle Cloud MMO | Conexión Segura</div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="Descon.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"Descon","experimentalVK":false,"fileSizes":{"Descon.pck":1876014140,"Descon.wasm":1508095},"focusCanvas":true,"gdextensionLibs":["libterrain.web.release.wasm32.wasm"],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const progressBar = document.getElementById('status-progress-bar');
	const percentageLabel = document.getElementById('status-percentage');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.style.opacity = '0';
			statusOverlay.style.transition = 'opacity 0.6s ease';
			setTimeout(() => {
				statusOverlay.remove();
			}, 600);
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Ocurrió un error inesperado al iniciar.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	}).filter((feat) => GODOT_THREADS_ENABLED || !feat.includes('Secure Context'));

	if (missing.length !== 0) {
		const missingMsg = 'Aviso\nFaltan las siguientes características del navegador:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.round((current / total) * 100));
					const curMB = (current / (1024 * 1024)).toFixed(1);
					const totMB = (total / (1024 * 1024)).toFixed(1);
					if (progressBar) progressBar.style.width = pct + '%';
					if (percentageLabel) percentageLabel.innerText = 'Cargando recursos... ' + pct + '% (' + curMB + ' MB / ' + totMB + ' MB)';
				} else {
					if (progressBar) progressBar.style.width = '100%';
					if (percentageLabel) percentageLabel.innerText = 'Iniciando motor gráfico...';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
